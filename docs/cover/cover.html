<!doctype html>
<!-- Source for docs/images/hero.jpg and og.png. Render at 1280x640 (2x for the hero). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#060607;color:#f4f4f6;font-family:Inter,sans-serif}
  .mono{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,244,246,.45)}
  .top{position:absolute;left:80px;right:80px;top:56px;display:flex;justify-content:space-between}
  .copy{position:absolute;left:80px;top:205px}
  h1{margin:0;font-weight:200;font-size:96px;letter-spacing:.18em;line-height:1}
  .sub{margin-top:26px}
  .rule{width:64px;height:1px;background:rgba(244,244,246,.35);margin:38px 0 0}
  .list{position:absolute;left:80px;bottom:56px;display:flex;gap:34px;font-size:11px;letter-spacing:.24em}
  .list b{font-weight:400;color:rgba(244,244,246,.85);margin-right:10px}
  .disc{position:absolute;right:-110px;top:50%;width:560px;height:560px;margin-top:-280px;border-radius:50%;overflow:hidden;
        background:url(../images/scene-mandala.jpg) center/cover;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 120px rgba(0,0,0,.8)}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;
        background:repeating-radial-gradient(circle,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.18) 3px 4px),radial-gradient(circle,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
  .disc::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#060607;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
</style></head>
<body>
  <div class="disc"></div>
  <div class="top mono"><span>Psychedelic audio visualizer</span><span style="margin-right:470px">v1 / 2026</span></div>
  <div class="copy">
    <h1>phosphene</h1>
    <div class="sub mono">Runs in your browser. Open source.</div>
    <div class="rule"></div>
  </div>
  <div class="list mono">
    <span><b>01</b>Fractal bloom</span><span><b>02</b>Wormhole</span><span><b>03</b>Liquid dream</span><span><b>04</b>Mandala</span><span><b>05</b>Gyroid</span>
  </div>
</body></html>
